[package]
name = "monitor-toggle"
version = "0.1.0"
edition = "2021"
description = "Ctrl + Dark — Turn off your monitors with a hotkey and recover displays reliably"

[lib]
name = "monitor_toggle"
path = "src/lib.rs"

[[bin]]
name = "monitor-toggled"
path = "src/bin/daemon.rs"

[[bin]]
name = "monitor-toggle"
path = "src/bin/cli.rs"

[[bin]]
name = "monitor-toggle-ui"
path = "src/bin/ui.rs"

[[bin]]
name = "CtrlDark"
path = "src/bin/launcher.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.38"
toml = "0.9"
wry = { version = "0.58", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
